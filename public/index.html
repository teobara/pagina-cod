<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Introdu codul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <!-- TEXT: editează titlul și descrierea de mai jos -->
    <div class="intro">
      <h1>Introdu<br><span class="accent-text">codul primit</span></h1>
      <p class="lead">Scrie mai jos codul de 6 cifre pe care l-ai primit și apasă „Trimite”.<br>Nu transmite acest cod nimănui. Introdu codul doar în interfața special creată pentru tine.<br>Codul este valabil o singură dată.</p>
    </div>

    <section class="card">
      <form id="code-form" novalidate>
        <div class="code-inputs" role="group" aria-label="Cod din 6 cifre">
          <input class="digit" type="text" inputmode="numeric" pattern="\d" maxlength="1" autocomplete="off" aria-label="Cifra 1">
          <input class="digit" type="text" inputmode="numeric" pattern="\d" maxlength="1" autocomplete="off" aria-label="Cifra 2">
          <input class="digit" type="text" inputmode="numeric" pattern="\d" maxlength="1" autocomplete="off" aria-label="Cifra 3">
          <input class="digit" type="text" inputmode="numeric" pattern="\d" maxlength="1" autocomplete="off" aria-label="Cifra 4">
          <input class="digit" type="text" inputmode="numeric" pattern="\d" maxlength="1" autocomplete="off" aria-label="Cifra 5">
          <input class="digit" type="text" inputmode="numeric" pattern="\d" maxlength="1" autocomplete="off" aria-label="Cifra 6">
        </div>

        <!-- Honeypot anti-bot: ascuns pentru oameni, nu-l șterge -->
        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" id="submit-btn">Trimite</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
